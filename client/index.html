<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Nectar</title>
  <style>
    /* Loading screen — shown until React mounts */
    body { margin: 0; background: #0a0a0f; }
    #nectar-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a0f;
      transition: opacity 0.4s ease-out;
    }
    #nectar-loading.fade-out { opacity: 0; pointer-events: none; }
    #nectar-loading svg { width: 80px; height: 80px; }
    #nectar-loading .icon-pulse {
      animation: pulse 2s ease-in-out infinite;
    }
    #nectar-loading .title {
      margin-top: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px; font-weight: 600; letter-spacing: 6px;
      color: #a8a29e; opacity: 0.7;
    }
    #nectar-loading .subtitle {
      margin-top: 8px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px; letter-spacing: 1px;
      color: #57534e; opacity: 0.6;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="nectar-loading">
    <div class="icon-pulse">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="la" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCD34D"/>
            <stop offset="100%" stop-color="#D97706"/>
          </linearGradient>
        </defs>
        <polygon points="16,8 22.5,11.5 22.5,18.5 16,22 9.5,18.5 9.5,11.5" fill="url(#la)" opacity="0.9"/>
        <path d="M16,4 C17.5,6 18.5,7.5 18.5,9 C18.5,10.4 17.4,11 16,11 C14.6,11 13.5,10.4 13.5,9 C13.5,7.5 14.5,6 16,4Z" fill="#FCD34D" opacity="0.8"/>
        <polygon points="10,10 12.5,8.5 15,10 15,13 12.5,14.5 10,13" fill="#F59E0B" opacity="0.35"/>
        <polygon points="17,10 19.5,8.5 22,10 22,13 19.5,14.5 17,13" fill="#F59E0B" opacity="0.35"/>
        <polygon points="10,15 12.5,13.5 15,15 15,18 12.5,19.5 10,18" fill="#F59E0B" opacity="0.25"/>
        <polygon points="17,15 19.5,13.5 22,15 22,18 19.5,19.5 17,18" fill="#F59E0B" opacity="0.25"/>
      </svg>
    </div>
    <div class="title">NECTAR</div>
    <div class="subtitle">Release Intelligence</div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Fade out loading screen once React mounts
    const observer = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const loader = document.getElementById('nectar-loading');
        if (loader) {
          loader.classList.add('fade-out');
          setTimeout(() => loader.remove(), 500);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });
  </script>
</body>
</html>
