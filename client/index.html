<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Nectar</title>
  <style>
    /* Loading screen — shown until React mounts */
    body { margin: 0; background: #0a0a0f; }
    #nectar-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a0f;
      transition: opacity 0.4s ease-out;
    }
    #nectar-loading.fade-out { opacity: 0; pointer-events: none; }
    #nectar-loading svg { width: 80px; height: 80px; }
    #nectar-loading .icon-pulse {
      animation: pulse 2s ease-in-out infinite;
    }
    #nectar-loading .title {
      margin-top: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px; font-weight: 600; letter-spacing: 6px;
      color: #a8a29e; opacity: 0.7;
    }
    #nectar-loading .subtitle {
      margin-top: 8px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px; letter-spacing: 1px;
      color: #57534e; opacity: 0.6;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="nectar-loading">
    <div class="icon-pulse">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE68A"/>
            <stop offset="100%" stop-color="#D97706"/>
          </linearGradient>
          <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FBBF24"/>
            <stop offset="100%" stop-color="#92400E"/>
          </linearGradient>
        </defs>
        <!-- Center hex -->
        <polygon points="16,12.5 19,14 19,17 16,18.5 13,17 13,14" fill="url(#lg2)"/>
        <!-- Outer source hexes -->
        <polygon points="16,5 17.8,6 17.8,8 16,9 14.2,8 14.2,6" fill="none" stroke="url(#lg1)" stroke-width="0.8"/>
        <polygon points="8.5,8.5 10.3,9.5 10.3,11.5 8.5,12.5 6.7,11.5 6.7,9.5" fill="none" stroke="url(#lg1)" stroke-width="0.8"/>
        <polygon points="23.5,8.5 25.3,9.5 25.3,11.5 23.5,12.5 21.7,11.5 21.7,9.5" fill="none" stroke="url(#lg1)" stroke-width="0.8"/>
        <polygon points="8.5,19 10.3,20 10.3,22 8.5,23 6.7,22 6.7,20" fill="none" stroke="url(#lg1)" stroke-width="0.8"/>
        <polygon points="23.5,19 25.3,20 25.3,22 23.5,23 21.7,22 21.7,20" fill="none" stroke="url(#lg1)" stroke-width="0.8"/>
        <!-- Connecting lines -->
        <line x1="16" y1="9" x2="16" y2="12.5" stroke="#FBBF24" stroke-width="0.6" opacity="0.5"/>
        <line x1="10.3" y1="11.5" x2="13" y2="14" stroke="#FBBF24" stroke-width="0.6" opacity="0.5"/>
        <line x1="21.7" y1="11.5" x2="19" y2="14" stroke="#FBBF24" stroke-width="0.6" opacity="0.5"/>
        <line x1="10.3" y1="20" x2="13" y2="17" stroke="#FBBF24" stroke-width="0.6" opacity="0.5"/>
        <line x1="21.7" y1="20" x2="19" y2="17" stroke="#FBBF24" stroke-width="0.6" opacity="0.5"/>
        <!-- Source dots -->
        <circle cx="16" cy="7" r="1" fill="#FBBF24" opacity="0.7"/>
        <circle cx="8.5" cy="10.5" r="1" fill="#FBBF24" opacity="0.7"/>
        <circle cx="23.5" cy="10.5" r="1" fill="#FBBF24" opacity="0.7"/>
        <circle cx="8.5" cy="21" r="1" fill="#FBBF24" opacity="0.7"/>
        <circle cx="23.5" cy="21" r="1" fill="#FBBF24" opacity="0.7"/>
      </svg>
    </div>
    <div class="title">NECTAR</div>
    <div class="subtitle">Release Intelligence</div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Fade out loading screen once React mounts
    const observer = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const loader = document.getElementById('nectar-loading');
        if (loader) {
          loader.classList.add('fade-out');
          setTimeout(() => loader.remove(), 500);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });
  </script>
</body>
</html>
