<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Apply saved theme immediately to prevent flash
    (function() {
      var t = localStorage.getItem('nectar-theme');
      if (t !== 'light') document.documentElement.classList.add('dark');
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Nectar</title>
  <style>
    /* Loading screen — shown until React mounts */
    body { margin: 0; background: #0a0a0f; }
    #nectar-loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a0f;
      transition: opacity 0.4s ease-out;
    }
    #nectar-loading.fade-out { opacity: 0; pointer-events: none; }
    #nectar-loading svg { width: 180px; height: 180px; }
    #nectar-loading .icon-wrap {
      position: relative;
    }
    /* Outer source hexes pulse in sequence — "collecting" */
    #nectar-loading .source-hex { opacity: 0.2; }
    #nectar-loading .sh1 { animation: collect 2.5s ease-in-out 0.0s infinite; }
    #nectar-loading .sh2 { animation: collect 2.5s ease-in-out 0.3s infinite; }
    #nectar-loading .sh3 { animation: collect 2.5s ease-in-out 0.6s infinite; }
    #nectar-loading .sh4 { animation: collect 2.5s ease-in-out 0.9s infinite; }
    #nectar-loading .sh5 { animation: collect 2.5s ease-in-out 1.2s infinite; }
    /* Lines light up matching their source hex */
    #nectar-loading .flow-line { opacity: 0.1; }
    #nectar-loading .fl1 { animation: flow 2.5s ease-in-out 0.0s infinite; }
    #nectar-loading .fl2 { animation: flow 2.5s ease-in-out 0.3s infinite; }
    #nectar-loading .fl3 { animation: flow 2.5s ease-in-out 0.6s infinite; }
    #nectar-loading .fl4 { animation: flow 2.5s ease-in-out 0.9s infinite; }
    #nectar-loading .fl5 { animation: flow 2.5s ease-in-out 1.2s infinite; }
    /* Center hex glows as data arrives */
    #nectar-loading .center-hex {
      animation: glow 2.5s ease-in-out infinite;
    }
    /* Dots pulse */
    #nectar-loading .source-dot { opacity: 0.3; }
    #nectar-loading .sd1 { animation: dot 2.5s ease-in-out 0.0s infinite; }
    #nectar-loading .sd2 { animation: dot 2.5s ease-in-out 0.3s infinite; }
    #nectar-loading .sd3 { animation: dot 2.5s ease-in-out 0.6s infinite; }
    #nectar-loading .sd4 { animation: dot 2.5s ease-in-out 0.9s infinite; }
    #nectar-loading .sd5 { animation: dot 2.5s ease-in-out 1.2s infinite; }
    #nectar-loading .title {
      margin-top: 32px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 22px; font-weight: 600; letter-spacing: 8px;
      color: #a8a29e; opacity: 0.7;
    }
    #nectar-loading .subtitle {
      margin-top: 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px; letter-spacing: 1px;
      color: #57534e; opacity: 0.6;
    }
    @keyframes collect {
      0%, 100% { opacity: 0.2; stroke-width: 0.8; }
      40% { opacity: 1; stroke-width: 1.4; }
    }
    @keyframes flow {
      0%, 100% { opacity: 0.1; }
      40%, 60% { opacity: 0.8; }
    }
    @keyframes dot {
      0%, 100% { opacity: 0.3; r: 1; }
      40% { opacity: 1; r: 1.5; }
    }
    @keyframes glow {
      0%, 100% { opacity: 0.6; filter: brightness(1); }
      50% { opacity: 1; filter: brightness(1.3); }
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="nectar-loading">
    <div class="icon-wrap">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE68A"/>
            <stop offset="100%" stop-color="#D97706"/>
          </linearGradient>
          <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FBBF24"/>
            <stop offset="100%" stop-color="#92400E"/>
          </linearGradient>
        </defs>
        <!-- Center hex (glows as data arrives) -->
        <polygon class="center-hex" points="16,12.5 19,14 19,17 16,18.5 13,17 13,14" fill="url(#lg2)"/>
        <!-- Outer source hexes (pulse in sequence) -->
        <polygon class="source-hex sh1" points="16,5 17.8,6 17.8,8 16,9 14.2,8 14.2,6" fill="none" stroke="url(#lg1)" stroke-width="0.8"/>
        <polygon class="source-hex sh2" points="8.5,8.5 10.3,9.5 10.3,11.5 8.5,12.5 6.7,11.5 6.7,9.5" fill="none" stroke="url(#lg1)" stroke-width="0.8"/>
        <polygon class="source-hex sh3" points="23.5,8.5 25.3,9.5 25.3,11.5 23.5,12.5 21.7,11.5 21.7,9.5" fill="none" stroke="url(#lg1)" stroke-width="0.8"/>
        <polygon class="source-hex sh4" points="8.5,19 10.3,20 10.3,22 8.5,23 6.7,22 6.7,20" fill="none" stroke="url(#lg1)" stroke-width="0.8"/>
        <polygon class="source-hex sh5" points="23.5,19 25.3,20 25.3,22 23.5,23 21.7,22 21.7,20" fill="none" stroke="url(#lg1)" stroke-width="0.8"/>
        <!-- Connecting lines (light up with their source) -->
        <line class="flow-line fl1" x1="16" y1="9" x2="16" y2="12.5" stroke="#FBBF24" stroke-width="0.6"/>
        <line class="flow-line fl2" x1="10.3" y1="11.5" x2="13" y2="14" stroke="#FBBF24" stroke-width="0.6"/>
        <line class="flow-line fl3" x1="21.7" y1="11.5" x2="19" y2="14" stroke="#FBBF24" stroke-width="0.6"/>
        <line class="flow-line fl4" x1="10.3" y1="20" x2="13" y2="17" stroke="#FBBF24" stroke-width="0.6"/>
        <line class="flow-line fl5" x1="21.7" y1="20" x2="19" y2="17" stroke="#FBBF24" stroke-width="0.6"/>
        <!-- Source dots (pulse with their hex) -->
        <circle class="source-dot sd1" cx="16" cy="7" r="1" fill="#FBBF24"/>
        <circle class="source-dot sd2" cx="8.5" cy="10.5" r="1" fill="#FBBF24"/>
        <circle class="source-dot sd3" cx="23.5" cy="10.5" r="1" fill="#FBBF24"/>
        <circle class="source-dot sd4" cx="8.5" cy="21" r="1" fill="#FBBF24"/>
        <circle class="source-dot sd5" cx="23.5" cy="21" r="1" fill="#FBBF24"/>
      </svg>
    </div>
    <div class="title">NECTAR</div>
    <div class="subtitle">Release Intelligence</div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // The loading screen stays until the app signals it has data.
    // React calls window.__nectarReady() once WebSocket is connected
    // and both releases + customers have loaded.
    window.__nectarDismissLoader = function() {
      const loader = document.getElementById('nectar-loading');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 500);
      }
    };
  </script>
</body>
</html>
